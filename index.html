<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201F">
<title>Usta — мастера Узбекистана</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#14201F;--ink2:#26343A;--bg:#F2F3EF;--card:#FFFFFF;--muted:#56625F;--line:#C9CEC6;--yellow:#FFC21A;--yellow-soft:#FFEFB8;--green:#12704A;--red:#A3271B;--on-dark:#E6EAE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2F7BD9;outline-offset:2px}
.top{background:var(--ink);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.logo{width:36px;height:36px;border-radius:10px;background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.brand{font-size:24px;font-weight:800;letter-spacing:-.5px}
.city{font-size:14px;color:var(--on-dark);margin-top:-8px}
.me{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--yellow);color:var(--yellow);font-weight:600;font-size:14px;display:flex;align-items:center}
.gh{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 9px;border-radius:22px;border:1px solid #5E6C69;background:transparent;color:var(--on-dark);font-weight:500;font-size:13px;flex:1 1 auto}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--ink);font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 14px;height:52px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}
.back{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--ink2);border:0;flex-shrink:0}
h1{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
h2{margin:0;font-size:20px;font-weight:700}
h3{margin:0;font-size:16px;font-weight:700}
main{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{background:var(--card);border-radius:16px;padding:12px 10px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;min-width:0;min-height:64px}
.cat span:last-child{min-width:0;overflow-wrap:anywhere}
.ico{width:40px;height:40px;border-radius:12px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cta{background:var(--yellow);border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}
.cta b{display:block;font-size:17px}
.cta small{font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.card .info{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.ava{width:52px;height:52px;border-radius:26px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.txt b{font-size:16px;overflow-wrap:anywhere}
.txt span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.call-round{width:48px;height:48px;border-radius:24px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.muted{color:var(--muted);font-size:14px}
.center{text-align:center}
.panel{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.panel p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.hero{display:flex;align-items:center;gap:14px}
.hero .ava{width:76px;height:76px;border-radius:38px;background:var(--yellow);font-size:26px;font-weight:800;color:var(--ink)}
.hero .sub{font-size:15px;color:var(--on-dark)}
.bar{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.btn{min-height:56px;border-radius:16px;border:0;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;width:100%}
.btn.green{background:var(--green);color:#fff}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);font-size:16px;min-height:48px;font-weight:600}
.btn.danger{background:transparent;color:var(--red);font-size:15px;min-height:44px;font-weight:600}
.btn[disabled]{opacity:.6}
.phone{font-size:18px;font-weight:600;text-align:center;user-select:all;font-variant-numeric:tabular-nums}
form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:14px;font-weight:600}
.f input,.f select,.f textarea{min-height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;width:100%}
.f textarea{padding:12px 14px;min-height:96px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.err{background:#FBE3DF;color:#7A1C12;border-radius:12px;padding:12px 14px;font-size:15px}
.warn{background:#FFEFB8;color:#4A3600;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:500}
.ok{background:#D9ECE3;color:#0C4A31;border-radius:12px;padding:12px 14px;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#E4E7E1;border-radius:14px;padding:4px}
.tabs button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:600}
.tabs button[aria-pressed="true"]{background:#fff}
.linkrow{display:flex;justify-content:center}
.locbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#fff;font-weight:600;font-size:15px;align-self:flex-start;margin:-10px 0 -8px}
.litem{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:8px 14px;background:#fff;border:0;border-radius:14px;font-size:16px;text-align:left;width:100%}
.litem.strong{font-weight:700;background:var(--yellow-soft)}
a.fchip{display:inline-flex;align-items:center}
.rate{color:#8A5A00;font-weight:600;font-size:14px;white-space:nowrap}
.hero .rate{color:var(--yellow);font-size:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fchip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;white-space:nowrap;flex-shrink:0}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1}
.phb{padding:0;border:0;background:#E4E7E1;border-radius:12px;overflow:hidden;width:100%;height:100%;display:block}
.phb img{width:100%;height:100%;object-fit:cover;display:block}
.phx{position:absolute;top:2px;right:2px;width:40px;height:40px;border-radius:20px;border:0;background:rgba(20,32,31,.85);color:#fff;font-size:22px;line-height:1}
.lb{position:fixed;inset:0;background:rgba(10,16,15,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;z-index:50}
.lb img{max-width:100%;max-height:78%;border-radius:8px}
.lb .btn{background:#fff;max-width:240px}
.stars{display:flex;gap:2px}
.star{width:44px;height:44px;border:0;background:transparent;font-size:32px;line-height:1;color:#C98A00;padding:0}
.rev{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid #E4E7E1}
.rev p{font-size:15px}
.lab{font-size:14px;font-weight:600}
.panel form{margin-top:8px;padding-top:12px;border-top:1px solid #E4E7E1}
/* ===== v3 */
:root{--bsoft:#E2ECF8;--gsoft:#DCEFE5;--rsoft:#FBE3DF;--navbg:#161A1A}
body{background:var(--bg)}
#app.withnav{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{gap:12px}
.lead{margin:0;font-size:15px;line-height:1.45;color:var(--ink2)}
.hero{background:var(--yellow);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.hero b{font-size:20px;line-height:1.2;text-wrap:balance}
.hero span{font-size:14px}
.hero.sm{padding:14px}.hero.sm b{font-size:16px}
.btn.dark{background:var(--ink);color:#fff;margin-top:4px}
.hero2{display:flex;align-items:center;gap:14px}
.hero2 .sub{font-size:14px;color:var(--on-dark)}
.ava.big{width:72px;height:72px;border-radius:36px;font-size:24px;font-weight:800}
.ava.y,.hero2 .ava{background:var(--yellow);color:var(--ink)}
.rate.y{color:var(--yellow)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px}
.cat4{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.ico4{width:58px;height:58px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 #DADDD6}
.ico4.dark{background:var(--ink)}
.card.col{flex-direction:column;align-items:stretch;gap:10px}
a.card{color:inherit}
.card.chosen{box-shadow:0 0 0 2px var(--green)}
.card.fresh{box-shadow:0 0 0 2px var(--yellow)}
.btn.sm{min-height:46px;font-size:15px;border-radius:12px;flex:1}
.btn.ghost{background:#fff}
.btn.ghost.danger,.btn.danger{color:var(--red)}
.btn.danger{border:1px solid var(--line);background:#fff}
.row .btn{width:auto}
.row.wrap{flex-wrap:wrap}.row.wrap .btn{flex:1 1 140px}
.col{display:flex;flex-direction:column}.gap{gap:10px}
.linkbtn{background:none;border:0;color:var(--ink);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:10px 0;min-height:44px;display:inline-flex;align-items:center;cursor:pointer}
.linkbtn.center{align-self:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap;vertical-align:middle}
.b-g{background:var(--gsoft);color:#0C4A31}.b-y{background:var(--yellow-soft);color:#5A4100}.b-b{background:var(--bsoft);color:#163F73}.b-r{background:var(--rsoft);color:#7A1C12}.b-x{background:#E4E7E1;color:#3D4846}
.chip{min-height:40px;padding:0 14px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.ok{display:inline-flex;align-items:center;background:var(--gsoft);border-color:#9FD3B8;color:#0C4A31}
.langs.light .chip{background:#fff;color:var(--ink);border-color:var(--line)}
.langs.light .chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.tawrap{position:relative}
.tawrap textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:12px 64px 12px 14px;background:#fff;resize:vertical;line-height:1.4}
.micwrap{position:absolute;right:8px;bottom:8px;display:flex;align-items:center;gap:6px}
.micbtn{width:48px;height:48px;border-radius:24px;border:0;background:var(--yellow);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.micbtn.on{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(163,39,27,.15)}}
@media (prefers-reduced-motion:reduce){.micbtn.on{animation:none}}
.rectime{font-size:13px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.voicebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.aud{width:100%;max-width:280px;height:40px}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:12px}
.thumbbtn{width:120px;height:90px;aspect-ratio:auto}
.morebtn{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;min-height:56px;width:100%}
.morebtn span{display:flex;flex-direction:column;gap:2px}.morebtn small{color:var(--muted);font-size:13px}
.morebtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.morebody{display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lab{font-size:14px;font-weight:600}
.f select{min-height:50px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.clamp1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--muted)}
.meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta .strong{color:var(--ink);font-weight:700}
.meta .dot{color:#7A1C12;font-weight:700}
.quote{font-size:14px;background:var(--bg);border-radius:12px;padding:10px 12px;line-height:1.4}
.thread{gap:12px}
.thread .txt{flex:1;min-width:0}
.nb.inline{position:static;border:0;margin-left:6px}
/* chat */
.chathead{position:sticky;top:0;z-index:5;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px}
.chathead .txt span{color:#B9C4C0;font-size:13px}
.chathead .txt{flex:1}
.ctx{margin:10px 16px 0;font-size:12px;color:var(--muted);background:#fff;border-radius:10px;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{display:flex;flex-direction:column;gap:8px;padding:12px 16px 120px;min-height:50vh}
.bub{max-width:80%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.35;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.bub small{font-size:11px;color:var(--muted);align-self:flex-end}
.bub.mine{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}.bub.mine small{color:#B9C4C0}
.bub.them{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.bub .aud{width:230px;max-width:100%}
.bubimg{width:220px;height:auto;max-width:100%;aspect-ratio:auto;padding:0;border-radius:12px}
.bubimg img{height:auto}
.inputbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;max-width:520px;margin:0 auto;z-index:6}
.inputbar .row{align-items:flex-end;gap:8px}
.inputbar textarea{flex:1;min-width:0;min-height:48px;max-height:120px;border:1px solid var(--line);border-radius:24px;padding:12px 16px;resize:none;background:var(--bg);line-height:1.3}
.attach{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-shrink:0;cursor:pointer}
.sendbtn{width:48px;height:48px;border-radius:24px;border:0;background:var(--yellow);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.inputbar .rectime{align-self:center}
.chaterr:empty{display:none}
/* master */
.subpill{white-space:nowrap}
.fchip.dark{background:transparent;color:#E6EAE8;border-color:#5E6C69}
.fchip.dark[aria-pressed="true"]{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
a.warn{display:block;color:#4A3600;text-decoration:none}
.plan{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--line);border-radius:16px;padding:14px;background:#fff;min-height:60px;width:100%;text-align:left;font-size:16px}
.plan[aria-pressed="true"]{border-color:var(--ink)}
.plan .p{font-weight:800;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cardno{font-size:20px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;user-select:all}
.paybtn{flex:1;min-height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.paybtn.click{background:#0083B3}.paybtn.payme{background:#1F8A8A}
.prog{height:8px;border-radius:4px;background:#E3E6DF;overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card.stat{flex-direction:column;align-items:center;gap:2px;padding:12px 6px;text-align:center}
.card.stat b{font-size:22px;font-variant-numeric:tabular-nums}.card.stat span{font-size:12px;color:var(--muted)}
.switch{width:56px;height:32px;border-radius:16px;border:0;background:#C9CEC6;position:relative;flex-shrink:0;padding:0}
.switch i{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--green)}.switch[aria-checked="true"] i{left:28px}
.details summary{cursor:pointer;min-height:32px;display:flex;align-items:center;list-style:none}
.details summary::after{content:'▾';margin-left:auto}
.details[open] summary::after{content:'▴'}
.tabs.three{grid-template-columns:repeat(3,minmax(0,1fr))}
main.nopad{padding-bottom:0;flex:0}
.stars.big{justify-content:center}.stars.big .star{font-size:40px;width:52px;height:52px}
.search{flex-direction:row}
.search input{flex:1;min-width:0}
.top .ava{color:var(--ink)}
.top .sub{color:var(--on-dark)}
.cat4{overflow-wrap:normal;word-break:normal;hyphens:auto;-webkit-hyphens:auto;font-size:11.5px}
.b-top{background:var(--ink);color:var(--yellow)}
.card.topcard{box-shadow:0 0 0 2px var(--yellow);background:#FFFBEA}
.stat-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px}
.stat-chip::before{content:'';width:8px;height:8px;border-radius:4px;background:currentColor}
.is-free{background:var(--gsoft);color:#0C4A31}.is-busy{background:#E4E7E1;color:#4A5553}
.top .is-free{background:#1F4D3A;color:#BFF0D5}.top .is-busy{background:#3A4644;color:#D5DBD9}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(127,127,127,.15);border-radius:14px;padding:4px}
.seg2 button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:15px;color:inherit}
.top .seg2 button{color:#E6EAE8}
.seg2 button.f[aria-pressed="true"]{background:var(--green);color:#fff}
.seg2 button.b[aria-pressed="true"]{background:#5C6563;color:#fff}
.ratep{gap:14px}
.bigrate{display:flex;flex-direction:column;align-items:center;min-width:92px}
.bigrate b{font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bigrate span{font-size:13px;color:var(--muted)}
.stars-s{color:#C98A00!important;font-size:15px!important;letter-spacing:1px}
.dist{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.drow,.crow{display:grid;grid-template-columns:14px 1fr 24px;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dbar,.cbar{height:8px;border-radius:4px;background:#E4E7E1;overflow:hidden}.dbar i,.cbar i{display:block;height:100%;background:#E2A800}
.dn{text-align:right}
.crit{display:flex;flex-direction:column;gap:8px;border-top:1px solid #E4E7E1;padding-top:12px}
.crow{grid-template-columns:minmax(0,9.5em) 1fr 28px;font-size:14px;color:var(--ink)}.crow b{text-align:right}

.stars.sm .star{font-size:26px;width:40px;height:40px}
.muted2{color:var(--muted)}
.btn.danger.solid{background:var(--red);color:#fff;border:0}
.plan .radio{width:20px;height:20px;border-radius:10px;border:2px solid var(--line);flex-shrink:0}
