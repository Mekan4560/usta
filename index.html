<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Usta — мастера Узбекистана</title>

<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#14201F;--ink2:#26343A;--bg:#F2F3EF;--card:#FFFFFF;--muted:#56625F;--line:#C9CEC6;--yellow:#FFC21A;--yellow-soft:#FFEFB8;--green:#12704A;--red:#A3271B;--on-dark:#E6EAE8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2F7BD9;outline-offset:2px}
.top{background:var(--ink);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.logo{width:36px;height:36px;border-radius:10px;background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.brand{font-size:24px;font-weight:800;letter-spacing:-.5px}
.city{font-size:14px;color:var(--on-dark);margin-top:-8px}
.me{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--yellow);color:var(--yellow);font-weight:600;font-size:14px;display:flex;align-items:center}
.gh{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 9px;border-radius:22px;border:1px solid #5E6C69;background:transparent;color:var(--on-dark);font-weight:500;font-size:13px;flex:1 1 auto}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--ink);font-weight:700}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 14px;height:52px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink)}
.back{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--ink2);border:0;flex-shrink:0}
h1{margin:0;font-size:22px;font-weight:700;text-wrap:balance}
h2{margin:0;font-size:20px;font-weight:700}
h3{margin:0;font-size:16px;font-weight:700}
main{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{background:var(--card);border-radius:16px;padding:12px 10px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;min-width:0;min-height:64px}
.cat span:last-child{min-width:0;overflow-wrap:anywhere}
.ico{width:40px;height:40px;border-radius:12px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cta{background:var(--yellow);border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto}
.cta b{display:block;font-size:17px}
.cta small{font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.card .info{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.ava{width:52px;height:52px;border-radius:26px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.txt b{font-size:16px;overflow-wrap:anywhere}
.txt span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.call-round{width:48px;height:48px;border-radius:24px;background:var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.muted{color:var(--muted);font-size:14px}
.center{text-align:center}
.panel{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.panel p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.hero{display:flex;align-items:center;gap:14px}
.hero .ava{width:76px;height:76px;border-radius:38px;background:var(--yellow);font-size:26px;font-weight:800;color:var(--ink)}
.hero .sub{font-size:15px;color:var(--on-dark)}
.bar{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.btn{min-height:56px;border-radius:16px;border:0;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;width:100%}
.btn.green{background:var(--green);color:#fff}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);font-size:16px;min-height:48px;font-weight:600}
.btn.danger{background:transparent;color:var(--red);font-size:15px;min-height:44px;font-weight:600}
.btn[disabled]{opacity:.6}
.phone{font-size:18px;font-weight:600;text-align:center;user-select:all;font-variant-numeric:tabular-nums}
form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:14px;font-weight:600}
.f input,.f select,.f textarea{min-height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;width:100%}
.f textarea{padding:12px 14px;min-height:96px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.err{background:#FBE3DF;color:#7A1C12;border-radius:12px;padding:12px 14px;font-size:15px}
.warn{background:#FFEFB8;color:#4A3600;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:500}
.ok{background:#D9ECE3;color:#0C4A31;border-radius:12px;padding:12px 14px;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#E4E7E1;border-radius:14px;padding:4px}
.tabs button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:600}
.tabs button[aria-pressed="true"]{background:#fff}
.linkrow{display:flex;justify-content:center}
.locbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:#fff;font-weight:600;font-size:15px;align-self:flex-start;margin:-10px 0 -8px}
.litem{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:8px 14px;background:#fff;border:0;border-radius:14px;font-size:16px;text-align:left;width:100%}
.litem.strong{font-weight:700;background:var(--yellow-soft)}
a.fchip{display:inline-flex;align-items:center}
.rate{color:#8A5A00;font-weight:600;font-size:14px;white-space:nowrap}
.hero .rate{color:var(--yellow);font-size:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.fchip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:14px;white-space:nowrap;flex-shrink:0}
.fchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1}
.phb{padding:0;border:0;background:#E4E7E1;border-radius:12px;overflow:hidden;width:100%;height:100%;display:block}
.phb img{width:100%;height:100%;object-fit:cover;display:block}
.phx{position:absolute;top:2px;right:2px;width:40px;height:40px;border-radius:20px;border:0;background:rgba(20,32,31,.85);color:#fff;font-size:22px;line-height:1}
.lb{position:fixed;inset:0;background:rgba(10,16,15,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;z-index:50}
.lb img{max-width:100%;max-height:78%;border-radius:8px}
.lb .btn{background:#fff;max-width:240px}
.stars{display:flex;gap:2px}
.star{width:44px;height:44px;border:0;background:transparent;font-size:32px;line-height:1;color:#C98A00;padding:0}
.rev{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid #E4E7E1}
.rev p{font-size:15px}
.lab{font-size:14px;font-weight:600}
.panel form{margin-top:8px;padding-top:12px;border-top:1px solid #E4E7E1}
</style>
</head>

function render(){

 else if(p[0]==='s'&&p[1]){let q=p.slice(1).join('/');try{q=decodeURIComponent(q)}catch(e){}viewList(null,q)}

}
